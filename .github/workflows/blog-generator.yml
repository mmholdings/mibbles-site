name: Blog Generator

on:
  schedule:
    # Mon / Wed / Fri at 13:00 UTC (~9am ET) — 3 posts/week
    - cron: "0 13 * * 1,3,5"
  workflow_dispatch:
    inputs:
      count:
        description: "How many posts to generate"
        required: false
        default: "1"

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Generate post(s)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o' }}
          GITHUB_ACTIONS: "true"
        run: |
          COUNT="${{ inputs.count || '1' }}"
          for i in $(seq 1 $COUNT); do
            pnpm tsx scripts/generate-post.ts
          done

      - name: Create draft PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: blog-draft/${{ github.run_number }}
          title: "[blog draft] Auto-generated post(s) for review"
          body: |
            Auto-generated by the Mibbles blog cron.

            **Review checklist before merging:**
            - [ ] Read end to end — does it sound human?
            - [ ] Are citations real? (Click every external link.)
            - [ ] Are the FAQ answers accurate?
            - [ ] Does the meta description sell the click?
            - [ ] Hero image prompt → generate, upload to `/public/blog/`, swap into frontmatter.
            - [ ] Remove `draft: true` from frontmatter when ready to ship.
          commit-message: "blog: add auto-generated draft post(s)"
          labels: blog-draft
          delete-branch: true
